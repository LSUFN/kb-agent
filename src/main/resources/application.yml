spring:
  application:
    name: kb-agent
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:kbagent}
    username: ${POSTGRES_USER:kbagent}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    # ADR-05：禁止 open-in-view，避免 SSE 长连接期间一直占用数据库连接
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  mvc:
    async:
      # SSE 一轮问答最长 5 分钟（与 Nginx 读超时 300 秒一致，§6.4）；必须小于 app.chat.stale-stream-timeout
      request-timeout: 5m
  ai:
    model:
      # 只使用 Chat（M3 起）和 Embedding（M2 起），其余模型不创建
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      # Spring AI 2.0 底层是 OpenAI 官方 SDK：base-url 必须以 /v1 结尾（§2.2 S2）
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${AI_API_KEY:}
      chat:
        options:
          model: ${AI_CHAT_MODEL:qwen-plus}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-v3}
          dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
    # §4.6：Spring AI 自带的 observation 不记录 Prompt、回答和工具内容。2.0.2 的默认值都是 false，
    # 这里显式写出，防止升级后默认值变化（ApplicationIT 断言实际生效的值）
    chat:
      client:
        observations:
          log-prompt: false
          log-completion: false
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: false
    tools:
      observations:
        include-content: false

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        # health 公开；info、prometheus 只对 ADMIN 开放（SecurityConfig）
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

app:
  security:
    jwt:
      # HS256 签名密钥，至少 32 字节；只能通过环境变量注入，未设置时拒绝启动
      secret: ${JWT_SECRET:}
      issuer: kb-agent
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    # 用户状态缓存；管理员修改用户后会立即清除对应条目
    actor-cache-ttl: 30s
    login-rate-limit-per-minute: ${APP_LOGIN_RATE_LIMIT_PER_MINUTE:10}
  demo:
    # 启动时创建 admin / analyst / user 三个演示账号；只在账号不存在时创建，不覆盖已有密码
    seed-users: false
    password: ${DEMO_USER_PASSWORD:}
  storage:
    root: ${APP_STORAGE_ROOT:./data/storage}
    # 对账只清理早于宽限期的文件，避免误删正在上传的文件（§4.1）
    orphan-grace-period: 1h
    reconcile-interval: 1h
  task:
    scan-interval: 5s
    lease-duration: 5m
    worker-concurrency: 2
    retry-base-delay: 30s
    retry-max-delay: 10m
  ingestion:
    chunk-size: 500
    chunk-overlap: 80
    max-chunks: 3000
  embedding:
    # 必须与 doc_chunk.embedding 的列维度一致，启动时校验
    dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
    # 通义 text-embedding-v3 单次最多 10 条（Spike S3）
    batch-size: 10
    model: ${AI_EMBEDDING_MODEL:text-embedding-v3}
  retrieval:
    top-k: 5
    # 余弦相似度阈值：一个片段都达不到时直接拒答、不调用模型。按真实模型校准，见 README M3
    min-score: ${APP_RETRIEVAL_MIN_SCORE:0.5}
    ef-search: 100
  chat:
    # 每个用户每分钟最多提问次数（§4.7）
    rate-limit-per-minute: ${APP_RATE_LIMIT_PER_MINUTE:20}
    history-rounds: 3
    heartbeat-interval: 15s
    stale-stream-timeout: 10m
    stale-scan-interval: 1m
  llm-log:
    # NONE：不记录用户问题；MASKED_PREVIEW：脱敏后记录前 200 字（§4.6）
    content: ${APP_LLM_LOG_CONTENT:MASKED_PREVIEW}
    retention-days: ${APP_LOG_RETENTION_DAYS:30}
