spring:
  application:
    name: kb-agent
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:kbagent}
    username: ${POSTGRES_USER:kbagent}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    # ADR-05：禁止 open-in-view，避免 SSE 长连接期间一直占用数据库连接
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        # health 公开；info、prometheus 只对 ADMIN 开放（SecurityConfig）
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

app:
  security:
    jwt:
      # HS256 签名密钥，至少 32 字节；只能通过环境变量注入，未设置时拒绝启动
      secret: ${JWT_SECRET:}
      issuer: kb-agent
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    # 用户状态缓存；管理员修改用户后会立即清除对应条目
    actor-cache-ttl: 30s
    login-rate-limit-per-minute: ${APP_LOGIN_RATE_LIMIT_PER_MINUTE:10}
  demo:
    # 启动时创建 admin / analyst / user 三个演示账号；只在账号不存在时创建，不覆盖已有密码
    seed-users: false
    password: ${DEMO_USER_PASSWORD:}
