# 前端容器的 Nginx 配置（M6）：托管静态文件，/api 反向代理到后端容器。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # 与后端的上传上限一致（单个文件 20 MB）
    client_max_body_size 21m;

    # 安全响应头。location 里没有再写 add_header，所以这些会被继承（写了就会整组覆盖）。
    # CSP 不允许内联脚本和外部来源：模型输出即使绕过了 DOMPurify，也执行不了脚本、发不出外部请求
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 写在 server 级别，各 location 继承（location 里一旦写了 proxy_set_header，就不再继承这里的任何一条）
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 流式问答（SSE）：不缓冲、不压缩，否则要攒满缓冲区才发给浏览器；读超时与后端的 5 分钟一致（§6.4）
    location ~ ^/api/v1/conversations/\d+/messages/stream$ {
        proxy_pass http://backend:8080;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_read_timeout 60s;
    }

    # 文件名带内容哈希，可以长期缓存
    location /assets/ {
        expires 1y;
    }

    # 前端路由（/chat/12 等）都返回 index.html；index.html 本身不缓存，发版后立即生效
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
