# 每次推送到 main 和每个 Pull Request：后端全部测试、前端测试与打包、在全新的 Linux 机器上用 Docker Compose 部署并冒烟检查。
# 不需要任何密钥：测试使用 Fake 模型，部署检查只验证启动、登录和反向代理，不调用模型。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试（单元 + 集成）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # mvnw 默认从阿里云镜像下载 Maven 本体（方便国内开发），CI 改用官方源
      MVNW_REPOURL: https://repo.maven.apache.org/maven2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 集成测试由 Testcontainers 启动 pgvector 和 Redis，runner 自带 Docker
      - name: mvnw verify
        run: ./mvnw -B -ntp verify
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  frontend:
    name: 前端测试与打包
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: 类型检查 + 打包
        run: npm run build

  deploy-smoke:
    name: Docker Compose 部署检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: 按 README 准备 .env（只用于本次检查的占位值）
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^JWT_SECRET=$/JWT_SECRET=ci-only-jwt-secret-not-for-real-use-0123456789/' \
            -e 's/^DEMO_USER_PASSWORD=$/DEMO_USER_PASSWORD=ci-demo-password/' \
            -e 's/^AI_API_KEY=$/AI_API_KEY=ci-dummy-key/' \
            .env
      - name: docker compose up（等待全部服务健康）
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: 经 Nginx 访问：前端页面、安全响应头、接口、演示账号登录
        run: |
          set -eu
          curl -fsS -o /dev/null http://localhost:8088/
          curl -fsSI http://localhost:8088/ | grep -i '^content-security-policy:'
          curl -fsS -o /dev/null http://localhost:8088/chat/1
          curl -fsS http://localhost:8088/api/v1/system/ping | grep -q '"code":"OK"'
          curl -fsS -X POST http://localhost:8088/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"analyst","password":"ci-demo-password"}' | grep -q '"accessToken"'
          docker compose ps
      - name: 失败时输出容器日志
        if: failure()
        run: docker compose logs --no-color --tail 200
